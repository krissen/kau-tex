name: CI

# Pull requests are the gate; a squash merge of a green PR adds nothing to
# test on main. Docs-only changes do not compile anything.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pins live in the Makefile. Fetch them on the runner; the container
      # runs as another user and only reads them.
      - run: make fetchdeps
      - name: make check
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            texlive/texlive:latest \
            sh -c 'apt-get update -qq && apt-get install -y -qq make >/dev/null && make check FETCHDEPS='
      - name: show diffs
        if: failure()
        run: find . -name '*.diff' -print -exec cat {} \;
